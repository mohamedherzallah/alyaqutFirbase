<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>مركز الياقوت التعليمي - إدارة متكاملة</title>

    <!-- مكتبات Firebase السحابية -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      :root{--primary:#003366;--primary-dark:#002244;--accent:#d4af37;--accent-light:#fef3c7;--bg:#f1f5f9;--card-bg:#fff;--text:#1e293b;--text-muted:#64748b;--success:#059669;--danger:#dc2626;--border:#e2e8f0}
      *{-webkit-tap-highlight-color:transparent}
      body{margin:0;font-family:Cairo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);direction:rtl;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
      header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:3px solid var(--accent);position:sticky;top:0;z-index:99}
      h1{font-size:16px;margin:0;font-weight:800}
      .month-badge{background:rgba(255,255,255,.15);color:var(--accent);padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
      #st{font-size:11px;white-space:nowrap}
      nav{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin-inline:auto;z-index:100;display:flex;gap:2px;background:#fff;border-top:1px solid var(--border);border-radius:18px 18px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
      nav button{flex:1;border:0;background:none;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font:inherit;font-size:11px;font-weight:700;cursor:pointer;transition:.2s}
      nav button b{font-size:20px;line-height:1}
      nav button.on{color:var(--primary);background:var(--accent-light)}
      main{padding:14px 12px;max-width:600px;margin:auto}
      @keyframes in{from{opacity:0;transform:translateY(6px)}}
      .c{background:var(--card-bg);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.04);border:1px solid var(--border);font-size:14px;line-height:1.8;animation:in .2s ease}
      label{display:block}
      .i{width:100%;box-sizing:border-box;min-height:44px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:4px 0 10px;font:inherit;font-size:15px;background:#fff;color:var(--text);outline:none;transition:.2s}
      .i:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,51,102,.12)}
      .b{background:var(--primary);color:#fff;border:0;border-radius:12px;min-height:44px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;transition:.15s;width:100%}
      .b:active{transform:scale(.97)}
      .s{width:auto;min-height:36px;padding:6px 14px;font-size:12px;margin:4px 0 0;margin-inline-end:6px;background:#e0e7ff;color:var(--primary)}
      .g{background:var(--success);color:#fff}.s.r{background:#fee2e2;color:#b91c1c}.b.r{background:var(--danger);color:#fff}.s.r{color:#b91c1c}
      .row{display:flex;gap:8px}.row>*{flex:1}
      small{color:var(--text-muted)}.k{font-weight:700;color:var(--primary)}
      #ls:empty::before{content:"لا توجد نتائج";display:block;text-align:center;color:#94a3b8;padding:30px}
      .badge-note{background:var(--accent-light);color:#92400e;padding:4px 8px;border-radius:8px;font-size:12px;margin:6px 0;display:block}
      .pay-history{background:#f8fafc;border:1px dashed var(--border);border-radius:10px;padding:10px;margin-top:8px}
      .pay-item{display:flex;justify-content:space-between;align-items:center;gap:6px;border-bottom:1px solid var(--border);padding:6px 0}.pay-item:last-child{border:0}
      .method-tag,.time-badge{background:#e0f2fe;color:#0369a1;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
      .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
      .t{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:8px 10px}.t small{display:block;font-size:11px}.t b{font-size:17px}
      .net{border-radius:12px;padding:10px 14px;color:#fff;display:flex;justify-content:space-between;align-items:center}.net small{color:#fff;opacity:.85}.net b{font-size:20px}
      #md>.c{position:absolute!important;bottom:0;left:0;right:0;margin:0!important;max-width:none!important;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom));animation:in .25s}
      #tt{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;z-index:9999;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}#tt.on{opacity:1}
    </style>
  </head>
  <body>
    <header><h1>💎 مركز الياقوت</h1><div id="monthDisplay" class="month-badge"></div><div id="st"></div></header>

    <main id="v"></main><nav id="nv"></nav>

    <div id="tt"></div><div id="md" style="display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 999; backdrop-filter: blur(2px)"></div>

    <script>
      // مفاتيح مشروعك الخاصة alyaqout-f6e54
      const firebaseConfig = {
        apiKey: "AIzaSyDDJQR5B0at-QY5_i5-6mIdpIIcIpbd8RY",
        authDomain: "alyaqout-f6e54.firebaseapp.com",
        projectId: "alyaqout-f6e54",
        storageBucket: "alyaqout-f6e54.firebasestorage.app",
        messagingSenderId: "959781323114",
        appId: "1:959781323114:web:9fb25080f28460d05fe513",
        measurementId: "G-X58SGMVMSP"
      };

      // تهيئة اتصال Firebase مع تفعيل العمل بدون إنترنت (Offline Sync)
      firebase.initializeApp(firebaseConfig);
      const fs = firebase.firestore();
      fs.enablePersistence({ synchronizeTabs: true }).catch(() => {});

      const G = [...Array(12)].map((_, i) => "الصف " + (i + 1));
      const D = ["سبت,اثنين,اربعاء", "أحد,ثلاثاء,خميس", "السبت", "الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة"];

      const TABS = [
        ["st", "👨‍🎓 الطلاب"],
        ["te", "👩‍🏫 المعلمون"],
        ["at", "📋 الحضور"],
        ["sc", "🗓 الجدول"],
        ["pa", "💰 المالية"],
        ["se", "⚙️ إعدادات"],
      ];

      let tab = "st",
        db = { teachers: [], students: [], payments: [], schedule: [], expenses: [], attendance: [], settings: [] };

      // عرض الشهر والسنة الحاليين
      const currentMonthText = new Date().toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' });
      document.getElementById("monthDisplay").textContent = "📅 " + currentMonthText;

      // استماع لحظي ومباشر للبيانات بدون Refresh
      const PW = {};
      const collections = ["teachers", "students", "payments", "schedule", "expenses", "attendance", "settings"];
      collections.forEach((col) => {
        fs.collection(col).onSnapshot({ includeMetadataChanges: true }, (snapshot) => {
          PW[col] = snapshot.metadata.hasPendingWrites; upSt();
          db[col] = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
          render();
        });
      });

      const N = (v) => Number(v) || 0,
        E = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => "&#" + c.charCodeAt(0) + ";"),
        uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
        today = () => new Date().toISOString().slice(0, 10);

      // تنظيف وتوحيد النصوص لتجاهل الأخطاء الإملائية
      function cleanText(str) {
        if (!str) return "";
        return String(str)
          .trim()
          .toLowerCase()
          .replace(/[أإآ]/g, "ا")
          .replace(/ة/g, "ه")
          .replace(/ى/g, "ي")
          .replace(/\s+/g, " ");
      }

      // تحويل الوقت إلى نظام 12 ساعة (ص / م)
      function format12h(timeStr) {
        if (!timeStr) return "";
        let [h, m] = timeStr.split(":").map(Number);
        const period = h >= 12 ? "م" : "ص";
        h = h % 12 || 12;
        return `${h}:${m < 10 ? "0" + m : m} ${period}`;
      }

      // تحويل الوقت بالدقائق لحساب التداخلات
      function toMinutes(tStr) {
        if (!tStr) return 0;
        const [h, m] = tStr.split(":").map(Number);
        return h * 60 + m;
      }

      const sum = (a) => a.reduce((x, p) => x + N(p.amount), 0);
      const S = (k) => { const r = db.settings.find((x) => x.id == k); return r ? N(r.value) : 0; };
      const P = (g) => S("p" + g);
      const pct = () => (db.settings.some((x) => x.id == "pct") ? S("pct") : 60);
      const durationMins = () => (db.settings.some((x) => x.id == "duration") ? S("duration") : 60);

      const tn = (id) => (db.teachers.find((t) => t.id == id) || {}).name || "—";
      const TO = (s) => db.teachers.map((t) => `<option value="${t.id}"${t.id == s ? " selected" : ""}>${E(t.name)}</option>`).join("");
      const gids = (id) => { const s = db.students.find((x) => x.id == id) || {}; return db.students.filter((x) => (x.pkg || x.id) == (s.pkg || s.id)).map((x) => x.id); };
      const paidS = (id) => sum(db.payments.filter((p) => p.type == "student" && gids(id).includes(p.refId)));
      const studentPayments = (id) => db.payments.filter((p) => p.type == "student" && gids(id).includes(p.refId));

      function calcEndTime(st, mins) {
        if (!st) return "";
        const [h, m] = st.split(":").map(Number);
        const d = new Date();
        d.setHours(h, m + Number(mins || 60));
        return d.toTimeString().slice(0, 5);
      }

      const inc = (t, l) => { let a = 0; l.filter((p) => p.type == "student").forEach((p) => { const s = db.students.find((x) => x.id == p.refId); if (!s) return; const m = db.students.filter((x) => (x.pkg || x.id) == (s.pkg || s.id)); a += (N(p.amount) * m.filter((x) => x.teacherId == t.id).length) / m.length; }); return a; };
      function tStat(t) {
        return { ids: db.students.filter((s) => s.teacherId == t.id).map((s) => s.id), due: (inc(t, db.payments) * pct()) / 100, paid: sum(db.payments.filter((p) => p.type == "teacher" && p.refId == t.id)) };
      }

      function op(t, r, del) {
        if (del) {
          fs.collection(t).doc(r).delete();
        } else {
          fs.collection(t).doc(r.id).set(r, { merge: true });
        }
      }

      const del = (t, id) => confirm("تأكيد الحذف؟") && op(t, id, 1);

      // إضافة حصة للجدول مع منع التداخل لأي معلم في نفس اليوم
            const SUBJ = ["تأسيس عربي", "تأسيس رياضيات", "تأسيس انجليزي", "رياضيات", "عربي", "انجليزي", "علوم", "دين"];
      const DM = { "سبت,اثنين,اربعاء": ["السبت", "الاثنين", "الأربعاء"], "أحد,ثلاثاء,خميس": ["الأحد", "الثلاثاء", "الخميس"] }, dset = (d) => DM[d] || [d];
      const TS = (t) => (t.subjects && t.subjects.length ? t.subjects : SUBJ);
      const opt = (a, sel, ph) => `<option value="">${ph}</option>` + a.map((x) => `<option value="${E(x[0])}"${x[0] == sel ? " selected" : ""}>${E(x[1])}</option>`).join("");
      const rowH = (sv, tv) => { const T = db.teachers.find((t) => t.id == tv); return `<div class=row><select class="i sb" onchange="fl(this.parentNode)">${opt((T ? TS(T) : SUBJ).map((x) => [x, x]), sv, "— المادة —")}</select><select class="i th" onchange="fl(this.parentNode)">${opt(db.teachers.filter((t) => !sv || TS(t).includes(sv)).map((t) => [t.id, t.name]), tv, "— المعلم —")}</select></div>`; };
      function fl(r) { const n = document.createElement("div"); n.innerHTML = rowH(r.querySelector(".sb").value, r.querySelector(".th").value); r.innerHTML = n.firstChild.innerHTML; }

      function addC(f) {
        const r = rws.querySelector(".row"), sub = r.querySelector(".sb").value, tid = r.querySelector(".th").value;
        if (!sub || !tid) return alert("اختر المادة والمعلم"), false;
        const ds = dset(f.d.value), a = toMinutes(f.tm.value), b = a + durationMins();
        const c = db.schedule.find((x) => dset(x.day).some((d) => ds.includes(d)) && a < toMinutes(x.startTime) + durationMins() && b > toMinutes(x.startTime));
        if (c && !confirm(`⚠️ تعارض مع حصة (${tn(c.teacherId)}) ${c.track || ""} الساعة ${format12h(c.startTime)}.\n\nهل تريد إضافة الحصة رغم التعارض؟`)) return false;
        op("schedule", { id: uid(), teacherId: tid, track: sub, grade: f.g.value, day: f.d.value, startTime: f.tm.value, note: f.nt.value });
        return false;
      }

      function addExpense(f) {
        op("expenses", { id: uid(), date: f.dt.value || today(), title: f.tl.value.trim(), amount: N(f.am.value), category: f.cat.value, note: f.nt.value.trim() });
        return false;
      }

      function saveSet(f) {
        const p = Math.min(100, Math.max(0, N(f.pct.value))), dur = Math.max(15, N(f.duration.value));
        const v = [["pct", p], ["duration", dur]];
        for (let i = 1; i <= 12; i++) v.push(["p" + i, N(f["p" + i].value)]);
        v.forEach((x) => op("settings", { id: x[0], value: x[1] }));
        alert("تم حفظ الإعدادات بنجاح");
        return false;
      }

      let qs = "", pq = "", pFilter = "all", eS = "", eT = "", mo = today().slice(0, 7), RT = "";

      const ER = (v, k) => `<button type=button class="b s r" onclick="${k}='';render()">إلغاء</button>`;

      const WD = { smw: [6, 1, 3], stt: [0, 2, 4] }, DY = { smw: "سبت-اثنين-أربعاء", stt: "أحد-ثلاثاء-خميس" }, D7 = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"], ATT = ["حاضر", "متأخر"];
      let adt = today();
      const dow = (d) => new Date(d + "T12:00:00").getDay(), pk = (g) => g.pkg || g.id;
      const attOf = (g) => db.attendance.filter((a) => a.pk == pk(g) && a.date >= (g.startDate || "9")).sort((x, y) => x.date.localeCompare(y.date));
      const doneN = (g) => attOf(g).filter((a) => ATT.includes(a.status)).length;
      function lastDate(g) { let n = 12 - doneN(g); if (n <= 0) return ""; const d = new Date((g.startDate > today() ? g.startDate : today()) + "T12:00:00"); for (let i = 0; i < 400; i++) { if (WD[g.days || "smw"].includes(d.getDay()) && --n <= 0) return d.toISOString().slice(0, 10); d.setDate(d.getDate() + 1); } return ""; }
      function mark(k, s2) { if (!k) return alert("اختر طالباً"); const r = db.attendance.find((a) => a.pk == k && a.date == adt); if (r && r.status == s2) return op("attendance", r.id, 1); op("attendance", { id: r ? r.id : uid(), pk: k, date: adt, status: s2 }); }
      function renew(k) { const d = prompt("تاريخ بدء الاشتراك الجديد (yyyy-mm-dd):", today()); if (/^\d{4}-\d\d-\d\d$/.test(d || "")) db.students.filter((s) => (s.pkg || s.id) == k).forEach((m) => op("students", { ...m, startDate: d })); }

      const SG = () => { const m = {}; db.students.forEach((s) => (m[s.pkg || s.id] = m[s.pkg || s.id] || []).push(s)); return Object.values(m).map((ms) => { const L = ms.find((x) => N(x.price) > 0) || ms[0]; return { ...L, ms, price: ms.reduce((a, x) => a + N(x.price), 0), track: ms.map((x) => x.track).join(" + ") }; }); };
      const delG = (k) => confirm("حذف كل مواد هذا الطالب؟") && db.students.filter((s) => (s.pkg || s.id) == k).forEach((s) => op("students", s.id, 1));
      function ac(f) { const s = db.students.find((x) => cleanText(x.name) == cleanText(f.n.value)); if (s && !eS) { f.g.value = s.grade; f.pp.value = s.parent || ""; } }
      const SL = () => SG().filter((s) => cleanText(s.ms.map((x) => x.name).join() + (s.parent || "") + (s.note || "") + s.track).includes(cleanText(qs))).reverse().map((s) => {
        const p = paidS(s.id), r = s.price - p, ab = attOf(s).filter((a) => a.status == "غائب").length;
        return `<div class=c><span class=k style="font-size:15px">${E(s.name)}</span> <small>${G[(s.grade || 1) - 1] || ""}</small> ${s.parent ? `<a href="tel:${E(s.parent)}">📞</a>` : ""}
          ${s.ms.map((m) => `<br><span class=method-tag>${E(m.track)}</span> <small>${E(tn(m.teacherId))}</small> <a href="#" onclick="eS='${m.id}';scrollTo(0,0);render();return false">✏️</a>`).join("")}
          <br>الباقة: <b>${s.price} ₪</b> | مدفوع: ${p} ₪ | <b style="color:${r > 0 ? "#dc2626" : "#059669"}">متبقي: ${r} ₪</b>${ab ? ` | غياب: ${ab}` : ""}
          ${s.note ? `<div class="badge-note">📝 ${E(s.note)}</div>` : ""}
          ${s.startDate ? `<br>📅 ${DY[s.days || "smw"]} | بدأ ${s.startDate} | <b>الحصص ${doneN(s)}/12</b>${doneN(s) >= 12 ? " ⚠️ يلزم التجديد" : lastDate(s) ? ` | آخر حصة متوقعة ${lastDate(s)}` : ""}<details><summary>سجل الحضور (${attOf(s).length})</summary>${attOf(s).map((a) => `${a.date} ${D7[dow(a.date)]} — ${a.status}`).join("<br>") || "—"}</details>` : "<br><small>⚠️ لا يوجد تاريخ بدء — اضغط ✏️ وحدّده</small>"}
          <div><button class="b s" onclick="renew('${pk(s)}')">🔄 تجديد</button><button class="b s g" onclick="payModal('student','${s.id}')">+ دفعة</button><button class="b s r" onclick="delG('${s.pkg || s.id}')">حذف</button></div></div>`;
      }).join("");

      const TL = () => db.teachers.filter((t) => (cleanText(t.name) + cleanText(t.subject)).includes(cleanText(qs))).map((t) => {
        const x = tStat(t);
        return `<div class=c>
          <span class=k style="font-size:15px">${E(t.name)}</span> <small>(${E(t.subject)}) ${E(t.phone)} ${t.startDate ? `(تاريخ البدء: ${t.startDate})` : ""}</small>
          <br>الطلاب (${x.ids.length}): <small>${x.ids.map((i) => E((db.students.find((s) => s.id == i) || {}).name)).join("، ") || "—"}</small>
          <br>المستحق: ${x.due.toFixed(0)} ₪ | المصروف: ${x.paid} ₪ | <b>الرصيد: ${(x.due - x.paid).toFixed(0)} ₪</b>
          <br style="margin-top:6px"><button class="b s g" onclick="payModal('teacher','${t.id}')">+ صرف</button><button class="b s" onclick="eT='${t.id}';scrollTo(0,0);render()">تعديل</button><button class="b s r" onclick="del('teachers','${t.id}')">حذف</button>
        </div>`;
      }).join("");

      function payModal(type, ref) {
        md.style.display = "block";
        md.innerHTML = `<div class=c style="max-width:360px;margin:50px auto">
          <b style="color:#003366;font-size:15px">💳 تسجيل دفعة مالية جديدة</b>
          <form onsubmit="return confirmPay('${type}','${ref}',this)">
            <label><small>المبلغ (شيكل):</small><input class=i type=number min=1 required name=am placeholder="أدخل المبلغ"></label>
            <label><small>طريقة الدفع:</small>
              <select class=i name=mth required>
                <option value="كاش">كاش 💵</option>
                <option value="تحويل بنكي">تحويل بنكي 🏦</option>
                <option value="محفظة جوال باي">محفظة جوال باي 📱</option>
                <option value="محفظة بال باي">محفظة بال باي 💳</option>
                <option value="أخرى">أخرى 📝</option>
              </select>
            </label>
            <label><small>ملاحظة على الدفعة (اختياري):</small><input class=i name=nt placeholder="مثال: قسط أول / رسوم التسجيل"></label>
            <div style="display:flex;gap:6px;margin-top:8px">
              <button class="b s g" style="flex:1">تأكيد الحفظ</button>
              <button type=button class="b s r" onclick="md.style.display='none'">إلغاء</button>
            </div>
          </form>
        </div>`;
      }

      function confirmPay(type, ref, f) {
        const a = N(f.am.value);
        if (a > 0) {
          const id = uid();
          op("payments", { id, date: today(), type, refId: ref, amount: a, method: f.mth.value, note: f.nt.value.trim() });
          md.style.display = "none";
          if (type == "student") rc(id);
        }
        return false;
      }

      function openAttendance(id, date) {
        const sch = db.schedule.find((s) => s.id == id); if (!sch) return; date = date || today();
        const ms = db.students.filter((s) => s.teacherId == sch.teacherId && s.grade == sch.grade && (!sch.track || s.track == sch.track));
        const rows = ms.map((s) => { const r = db.attendance.find((a) => a.scheduleId == id && a.studentId == s.id && a.date == date), v = r ? r.status : "حاضر";
          return `<div class=pay-item><span>${E(s.name)}</span><select id="att_${s.id}" class=i style="width:110px;margin:0">${["حاضر", "غائب", "متأخر", "بعذر"].map((x) => `<option${x == v ? " selected" : ""}>${x}</option>`).join("")}</select></div>`; }).join("");
        md.style.display = "block";
        md.innerHTML = `<div class=c><b>📋 كشف الحضور</b><br><small>${E(tn(sch.teacherId))} | ${E(sch.track || "")} | ${G[(sch.grade || 1) - 1]}</small>
          <input class=i type=date value="${date}" onchange="openAttendance('${id}',this.value)">
          ${rows || "<small>لا يوجد طلاب مسجلون لهذه المادة والصف مع هذا المعلم</small>"}
          ${ms.length ? `<button class="b g" onclick="saveAtt('${id}','${date}')">حفظ الكشف</button>` : ""}
          <button class="b s r" onclick="md.style.display='none'">إغلاق</button></div>`;
      }

      function saveAtt(id, date) {
        const sch = db.schedule.find((s) => s.id == id);
        db.students.filter((s) => s.teacherId == sch.teacherId && s.grade == sch.grade && (!sch.track || s.track == sch.track)).forEach((s) => {
          const el = document.getElementById("att_" + s.id); if (!el) return;
          const r = db.attendance.find((a) => a.scheduleId == id && a.studentId == s.id && a.date == date);
          op("attendance", { id: r ? r.id : uid(), date, scheduleId: id, studentId: s.id, status: el.value });
        });
        alert("تم حفظ الحضور"); md.style.display = "none";
      }

      function rc(id) {
        const p = db.payments.find((x) => x.id == id);
        if (!p) return;
        const s = SG().find((g) => g.ms.some((x) => x.id == p.refId)) || {};
        const d = paidS(s.id);
        const rem = N(s.price) - d;

        RT = `مركز الياقوت التعليمي
إيصال قبض رقم: ${p.id}
التاريخ: ${p.date}
الطالب: ${s.name || "—"}
الصف: ${G[(s.grade || 1) - 1] || "—"}
المادة: ${s.track || "—"}
المبلغ: ${N(p.amount)} شيكل
طريقة الدفع: ${p.method || "كاش"}
${p.note ? `ملاحظة الدفعة: ${p.note}\n` : ""}إجمالي المدفوع: ${d} من أصل ${N(s.price)} شيكل
المتبقي: ${rem} شيكل`;

        md.style.display = "block";
        md.innerHTML = `<div class=c style="max-width:340px;margin:50px auto;white-space:pre-line;text-align:right">
          <div style="text-align:center;font-weight:bold;color:#003366;font-size:15px;margin-bottom:8px">🧾 إيصال قبض - مركز الياقوت</div>
          <b>${E(RT)}</b>
          <div style="margin-top:12px;display:flex;gap:6px;justify-content:center">
            <button class="b s g" onclick="shr()">نسخ / مشاركة</button>
            <button class="b s r" onclick="md.style.display='none'">إغلاق</button>
          </div>
        </div>`;
      }

      async function shr() {
        try {
          if (navigator.share) await navigator.share({ text: RT });
          else {
            await navigator.clipboard.writeText(RT);
            alert("تم نسخ النص للإيصال");
          }
        } catch (e) {}
      }

      const rep = () => {
        const m = db.payments.filter((p) => String(p.date).startsWith(mo)),
          iS = sum(m.filter((p) => p.type == "student")),
          mExp = sum(db.expenses.filter((x) => String(x.date).startsWith(mo))),
          td = (iS * pct()) / 100,
          grossCenter = iS - td,
          netCenter = grossCenter - mExp;

        const tr = db.teachers.map((t) => {
          const ids = db.students.filter((s) => s.teacherId == t.id).map((s) => s.id),
            i = inc(t, m),
            o = sum(m.filter((p) => p.type == "teacher" && p.refId == t.id));
          return `<br>• ${E(t.name)}: مستحق ${((i * pct()) / 100).toFixed(0)} ₪ | مصروف ${o} ₪`;
        }).join("");

        const un = SG().map((s) => ({ s, r: N(s.price) - paidS(s.id) })).filter((x) => x.r > 0).map((x) => `<br>• ${E(x.s.name)} (${E(x.s.track)}) — متبقي: ${x.r} ₪ ${x.s.parent ? `<a href="tel:${E(x.s.parent)}">📞</a>` : ""}`).join("");

        return `<div class=c>
          <b>📊 التقرير المالي الشامل (${mo})</b>
          <input class=i type=month value="${mo}" onchange="mo=this.value;render()">
          <div class=g2><div class=t><small>المقبوضات</small><b>${iS} ₪</b></div><div class=t><small>حصة المعلمين (${pct()}%)</small><b>${td.toFixed(0)} ₪</b></div><div class=t><small>حصة المركز (${100 - pct()}%)</small><b>${grossCenter.toFixed(0)} ₪</b></div><div class=t><small>المصروفات</small><b style="color:#dc2626">${mExp} ₪</b></div></div><div class=net style="background:${netCenter >= 0 ? "#059669" : "#dc2626"}"><small>صافي أرباح المركز</small><b>${netCenter.toFixed(0)} ₪</b></div>
          <br><br><b>المعلمون للشهر:</b>${tr || " —"}
          <br><br><b>طلاب عليهم متبقي:</b>${un || " —"}
        </div>`;
      };

      function addS(f) {
        const rs = [...rws.querySelectorAll(".row")].map((r) => [r.querySelector(".sb").value, r.querySelector(".th").value]);
        if (rs.some((r) => !r[0] || !r[1])) return alert("اختر المادة والمعلم لكل سطر"), false;
        const nm = f.n.value.trim(), o = db.students.find((s) => s.id == eS) || {};
        const dup = rs.find((r) => db.students.find((s) => s.id !== eS && cleanText(s.name) == cleanText(nm) && cleanText(s.track) == cleanText(r[0])));
        if (dup && !confirm(`الطالب "${nm}" مسجل بالفعل في ${dup[0]}. تسجيله مرة أخرى؟`)) return false;
        const pkg = o.pkg || uid(), base = { name: nm, grade: f.g.value, parent: f.pp.value.trim(), note: f.nt.value.trim(), startDate: f.sd.value, days: f.dy.value }; eS = "";
        rs.forEach((r, i) => op("students", { ...base, id: o.id || uid(), date: o.date || today(), pkg, track: r[0], teacherId: r[1], price: o.id ? N(f.p.value) : i ? 0 : N(f.p.value) }));
        return false;
      }

      function addT(f) {
        const o = db.teachers.find((t) => t.id == eT) || {}, id = o.id || uid(), sj = [...f.querySelectorAll("[name=sj]:checked")].map((x) => x.value);
        eT = "";
        op("teachers", { id, name: f.n.value.trim(), phone: f.ph.value.trim(), subjects: sj, subject: sj.join("، "), startDate: f.sd.value });
        return false;
      }

      const V = {
        st() {
          const e = db.students.find((s) => s.id == eS) || {};
          return `<form class=c onsubmit="return addS(this)">
            <b>${e.id ? "✏️ تعديل مادة طالب" : "➕ تسجيل طالب (يمكن إضافة عدة مواد)"}</b>
            <input class=i name=n list=nl oninput="ac(this.form)" required placeholder="اسم الطالب" value="${E(e.name)}"><datalist id=nl>${[...new Set(db.students.map((s) => s.name))].map((n) => `<option value="${E(n)}">`).join("")}</datalist>
            <div class=row><select class=i name=g onchange="if(!${!!e.id})this.form.p.value=P(this.value)">${G.map((g, i) => `<option value=${i + 1}${e.grade == i + 1 ? " selected" : ""}>${g}</option>`).join("")}</select><input class=i name=pp value="${E(e.parent)}" placeholder="هاتف ولي الأمر"></div>
            <div id=rws>${rowH(e.track || "", e.teacherId || "")}</div>
            ${e.id ? "" : `<button type=button class="b s" onclick="rws.insertAdjacentHTML('beforeend',rowH('',''))">+ مادة أخرى</button>`}
            <small>بدء الاشتراك وأيام الحصص</small><div class=row><input class=i type=date name=sd value="${e.startDate || today()}"><select class=i name=dy><option value=smw${e.days == "stt" ? "" : " selected"}>سبت-اثنين-أربعاء</option><option value=stt${e.days == "stt" ? " selected" : ""}>أحد-ثلاثاء-خميس</option></select></div>
            <input class=i name=p type=number min=0 value="${e.id ? N(e.price) : P(1)}" placeholder="السعر الإجمالي للباقة (شيكل)" style="margin-top:8px">
            <input class=i name=nt value="${E(e.note)}" placeholder="📝 ملاحظات السعر والاتفاق">
            <button class=b>حفظ</button>${e.id ? ER(0, "eS") : ""}
          </form>
          <input class=i value="${E(qs)}" placeholder="🔍 بحث عن طالب" oninput="qs=this.value;ls.innerHTML=SL()">
          <div id=ls>${SL()}</div>`;
        },

        at() {
          const d = adt, gs = SG().filter((g) => g.startDate && g.startDate <= d), rec = (g) => db.attendance.find((a) => a.pk == pk(g) && a.date == d);
          const exp = gs.filter((g) => rec(g) || (WD[g.days || "smw"].includes(dow(d)) && doneN(g) < 12)), others = gs.filter((g) => !exp.includes(g)), nos = SG().filter((g) => !g.startDate).length;
          return `<div class=c><b>📋 كشف الحضور اليومي</b><input class=i type=date value="${d}" onchange="adt=this.value;render()"><b class=k>${D7[dow(d)]}</b> <small>${exp.length} طالب متوقع</small>${nos ? `<div class=badge-note>⚠️ ${nos} طالب بلا تاريخ بدء (عدّلهم من تبويب الطلاب)</div>` : ""}</div>` +
            exp.map((g) => { const r = rec(g), n = doneN(g), cur = r ? r.status : "";
              return `<div class=c><span class=k>${E(g.name)}</span> <small>${G[(g.grade || 1) - 1] || ""} · ${E(g.track)}</small><br><small>الحصة ${Math.min(n + (r && ATT.includes(r.status) ? 0 : 1), 12)} من 12</small>${n >= 12 && !r ? '<div class=badge-note>انتهت الحصص الـ12 — يلزم التجديد</div>' : ""}
              <div>${["حاضر", "متأخر", "غائب", "بعذر"].map((x) => `<button class="b s${cur == x ? (x == "غائب" ? " r" : " g") : ""}" onclick="mark('${pk(g)}','${x}')">${x}</button>`).join("")}</div></div>`; }).join("") +
            `<div class=c><b>➕ حضور استثنائي (يوم غير معتاد)</b><select class=i id=ex><option value="">— اختر طالباً —</option>${others.map((g) => `<option value="${pk(g)}">${E(g.name)}</option>`).join("")}</select><button class="b s g" onclick="mark(ex.value,'حاضر')">تسجيل حضور</button></div>`;
        },

        te() {
          const e = db.teachers.find((t) => t.id == eT) || {};
          return `<form class=c onsubmit="return addT(this)">
            <b>${e.id ? "✏️ تعديل بيانات معلم" : "➕ إضافة معلم جديد"}</b>
            <input class=i name=n required placeholder="اسم المعلم" value="${E(e.name)}">
            <div class=row>
              <input class=i name=ph placeholder="الهاتف" value="${E(e.phone)}">
              
            </div>
            <div class=c style="padding:8px;box-shadow:none">${SUBJ.map((x) => `<label style="display:inline-block;margin-inline-end:10px"><input type=checkbox name=sj value="${x}"${(e.subjects || []).includes(x) ? " checked" : ""}> ${x}</label>`).join("")}</div>
            <label><small>تاريخ بدء عمل المعلم في المركز:</small><input class=i name=sd type=date value="${e.startDate || today()}"></label>
            <button class=b>حفظ المعلم</button>${e.id ? ER(0, "eT") : ""}
          </form>
          <input class=i value="${E(qs)}" placeholder="🔍 بحث عن معلم..." oninput="qs=this.value;ls.innerHTML=TL()">
          <div id=ls>${TL()}</div>`;
        },

        sc() {
          const dur = durationMins();
          return `<form class=c onsubmit="return addC(this)">
            <b>🗓 إضافة حصة لجدول المركز</b>
            <div id=rws>${rowH("", "")}</div>
            <div class=row>
              <select class=i name=g>${G.map((g, i) => `<option value=${i + 1}>${g}</option>`).join("")}</select>
              <select class=i name=d>${D.map((d) => `<option>${d}</option>`).join("")}</select>
            </div>
            <div class=row>
              <label><small>وقت البدء:</small><input class=i name=tm type=time required onchange="this.form.endTimeDisplay.value=format12h(calcEndTime(this.value,${dur}))"></label>
              <label><small>وقت الانتهاء (تلقائي):</small><input class=i name=endTimeDisplay type=text readonly placeholder="مثال 04:00 م" style="background:#f8fafc"></label>
            </div>
            <input class=i name=nt placeholder="ملاحظة للحصة (مادة / تفاصيل)">
            <button class=b>حفظ الحصة بالجدول</button>
          </form>
          <div class=c style="background:#e0f2fe;color:#0369a1">⏱ مدة الحصة بالنظام: <b>${dur} دقيقة</b> | عرض الحصص بنظام 12 ساعة</div>` +
          D.map((d) => {
            const l = db.schedule.filter((x) => x.day == d).sort((a, b) => String(a.startTime).localeCompare(b.startTime));
            return l.length ? `<div class=c><b class=k style="font-size:14px">📍 ${d}</b>` + l.map((x) => {
              const start12 = format12h(x.startTime);
              const end12 = format12h(calcEndTime(x.startTime, dur));
              return `<div style="border-bottom:1px solid #f1f5f9;padding:8px 0">
              🕒 <span class="time-badge">${start12} - ${end12}</span> — <b>${E(tn(x.teacherId))}</b> ${E(x.track || "")} (${G[(x.grade || 1) - 1]})
              ${x.note ? `<br><small>📝 ${E(x.note)}</small>` : ""}
              <div style="margin-top:6px">
                
                <button class="b s r" onclick="del('schedule','${x.id}')">حذف الحصة</button>
              </div>
            </div>`;
            }).join("") + "</div>" : "";
          }).join("");
        },

        pa() {
          const mExp = sum(db.expenses.filter((x) => String(x.date).startsWith(mo)));

          const studentLedger = SG().filter((s) => {
            const matchesSearch = (cleanText(s.name) + cleanText(s.parent) + cleanText(s.note) + cleanText(s.track)).includes(cleanText(pq));
            const p = paidS(s.id);
            const rem = N(s.price) - p;
            if (pFilter == "rem") return matchesSearch && rem > 0;
            if (pFilter == "done") return matchesSearch && rem <= 0;
            return matchesSearch;
          }).map((s) => {
            const pList = studentPayments(s.id);
            const totalPaid = sum(pList);
            const rem = N(s.price) - totalPaid;

            const historyHtml = pList.length ? pList.map((p) => `<div class="pay-item">
              <span>📅 <b>${E(p.date)}</b> — <b style="color:#059669">${N(p.amount)} ₪</b> <span class="method-tag">${E(p.method || "كاش")}</span> ${p.note ? `<small>(${E(p.note)})</small>` : ""}</span>
              <div>
                <button class="b s g" onclick="rc('${p.id}')">🧾 إيصال</button>
                <button class="b s r" onclick="del('payments','${p.id}')">✕</button>
              </div>
            </div>`).join("") : `<div style="color:#94a3b8;font-size:11px">لا توجد دفعات مسجلة بعد</div>`;

            return `<div class=c>
              <div style="display:flex;justify-content:space-between;align-items:start">
                <div><span class=k style="font-size:15px">${E(s.name)}</span> <small>(${G[(s.grade || 1) - 1] || ""} - <span class="method-tag">${E(s.track)}</span>)</small></div>
                <button class="b s g" onclick="payModal('student','${s.id}')">+ تسجيل دفعة</button>
              </div>
              <div>الاتفاق: <b>${N(s.price)} ₪</b> | المدفوع: <b style="color:#059669">${totalPaid} ₪</b> | المتبقي: <b style="color:${rem > 0 ? "#dc2626" : "#059669"}">${rem} ₪</b></div>
              ${s.note ? `<div class="badge-note">📝 ملاحظات الاتفاق: ${E(s.note)}</div>` : ""}
              <div class="pay-history">
                <div style="font-weight:bold;margin-bottom:4px;font-size:11px;color:#003366">📋 سجل الدفعات التفصيلي:</div>
                ${historyHtml}
              </div>
            </div>`;
          }).join("");

          const expensesList = db.expenses.filter((x) => String(x.date).startsWith(mo)).map((x) => `<div class="pay-item">
            <span>📅 <b>${E(x.date)}</b> — ${E(x.title)} (${E(x.category)}): <b style="color:#dc2626">${N(x.amount)} ₪</b> ${x.note ? `<small>(${E(x.note)})</small>` : ""}</span>
            <button class="b s r" onclick="del('expenses','${x.id}')">✕</button>
          </div>`).join("");

          return `<div id=rp>${rep()}</div>
          <form class=c onsubmit="return addExpense(this)">
            <b>💸 إضافة مصروف تشغيلي للمركز</b>
            <div class=row><input class=i name=tl required placeholder="بيان المصروف"><input class=i name=am type=number min=1 required placeholder="المبلغ"></div>
            <div class=row>
              <select class=i name=cat required><option>إيجار المقر</option><option>كهرباء وماء</option><option>قرطاسية وطباعة</option><option>ضيافة ونظافة</option><option>صيانة وتسويق</option><option>أخرى</option></select>
              <input class=i name=dt type=date value="${today()}">
            </div>
            <input class=i name=nt placeholder="ملاحظة إضافية">
            <button class=b>تسجيل المصروف</button>
          </form>
          <div class=c><b>📋 سجل المصروفات التشغيلية للشهر الحالي (${mo})</b>${expensesList || '<div style="color:#94a3b8;font-size:12px">لا توجد مصروفات مسجلة</div>'}</div>
          <div class=c>
            <b>🔎 كشف حساب ومقبوضات الطلاب</b>
            <input class=i placeholder="🔍 بحث..." value="${E(pq)}" oninput="pq=this.value;render()">
            <div class=row style="margin-bottom:8px">
              <button class="b s ${pFilter == "all" ? "g" : ""}" onclick="pFilter='all';render()">الكل</button>
              <button class="b s ${pFilter == "rem" ? "g" : ""}" onclick="pFilter='rem';render()">عليهم متبقي</button>
              <button class="b s ${pFilter == "done" ? "g" : ""}" onclick="pFilter='done';render()">خالصين</button>
            </div>
          </div>
          <div>${studentLedger || '<div class=c>لا يوجد طلاب مطابقين</div>'}</div>`;
        },

        se() {
          return `<form class=c onsubmit="return saveSet(this)">
            <b>⚙️ إعدادات النظام وتوزيع النسب</b>
            <label><small>نسبة المعلم %:</small><input class=i name=pct type=number min=0 max=100 value="${pct()}" oninput="ap.textContent=100-this.value"></label>
            <small>حصة المركز تلقائياً: <span id=ap>${100 - pct()}</span>%</small>
            <br><br>
            <label><small>⏱ مدة الحصة الافتراضية (بالدقائق):</small><input class=i name=duration type=number min=15 max=240 value="${durationMins()}"></label>
            <br><br><b>📌 التسعيرة الافتراضية لكل صف (شيكل)</b>` +
          G.map((g, i) => `<label style="display:block;margin-bottom:4px"><small><b>${g}:</b></small><input class=i name=p${i + 1} type=number min=0 value="${P(i + 1)}"></label>`).join("") +
          `<br><button class=b>حفظ الإعدادات</button></form>`;
        },
      };

      function render() {
        nv.innerHTML = TABS.map((t) => { const [i, ...l] = t[1].split(" "); return `<button class="${t[0] == tab ? "on" : ""}" onclick="tab='${t[0]}';qs='';eS='';eT='';render();scrollTo(0,0)"><b>${i}</b>${l.join(" ")}</button>`; }).join("");
        const ae = document.activeElement, ph = ae && ae.placeholder && !ae.form ? ae.placeholder : "", pos = ph ? ae.selectionStart : 0;
        if (!ae || !/INPUT|SELECT/.test(ae.tagName) || ae.form == null) {
          v.innerHTML = V[tab]();
          if (ph) { const n = [...v.querySelectorAll("input")].find((x) => x.placeholder == ph); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } }
        }
      }

      let tm;
      window.alert = (m) => { tt.textContent = m; tt.classList.add("on"); clearTimeout(tm); tm = setTimeout(() => tt.classList.remove("on"), 2500 + m.length * 30); };
      md.onclick = (e) => { if (e.target === md) md.style.display = "none"; };
      const upSt = () => { const off = !navigator.onLine, pend = Object.values(PW).some(Boolean); st.textContent = off ? "🔴 أوفلاين" + (pend ? " — بيانات بانتظار المزامنة" : "") : pend ? "🟡 جارٍ المزامنة..." : ""; st.style.color = off ? "#fca5a5" : "#fde68a"; };
      addEventListener("online", upSt); addEventListener("offline", upSt); upSt();

      render();
    </script>
  </body>
</html>
