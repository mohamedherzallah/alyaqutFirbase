name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Bundle Firebase inside the APK so the app opens offline
      - name: Bundle Firebase SDK
        run: |
          B=https://www.gstatic.com/firebasejs/10.8.0
          curl -fsSLo www/fb-app.js $B/firebase-app-compat.js
          curl -fsSLo www/fb-fs.js $B/firebase-firestore-compat.js
          sed -i "s#$B/firebase-app-compat.js#fb-app.js#; s#$B/firebase-firestore-compat.js#fb-fs.js#" www/index.html

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Create Android project
        run: |
          npx cap init "Al-Yaqout" com.yaqout.center --web-dir www
          npx cap add android
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF'
          npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: YaqoutCenter-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
